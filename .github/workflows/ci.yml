name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Chrome for the QA harness
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Browser QA
        # The runners have no GPU, so Chrome falls back to software rendering
        # and a simulation advances slower than the wall clock. The checks
        # wait for results rather than for time, and one suite at a time keeps
        # the runner responsive.
        run: npm run qa
        env:
          QA_CONCURRENCY: '1'
          QA_PROTOCOL_TIMEOUT: '600000'

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshots
          path: tools/qa/shots/
          if-no-files-found: ignore

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Chrome for the QA harness
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Browser QA
        # The runners have no GPU, so Chrome falls back to software rendering
        # and a simulation advances slower than the wall clock. The checks
        # wait for results rather than for time, and one suite at a time keeps
        # the runner responsive.
        #
        # The step is retried because a shared runner can be momentarily
        # starved by its neighbours, which makes the page boot slowly — the
        # harness waits patiently and retries the navigation, and this retry
        # covers the rest.
        run: |
          for attempt in 1 2 3; do
            echo "::group::QA attempt $attempt"
            if npm run qa; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed"
            [ "$attempt" = "3" ] && exit 1
            sleep 10
          done
        env:
          QA_CONCURRENCY: '1'
          QA_PROTOCOL_TIMEOUT: '600000'

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshots
          path: tools/qa/shots/
          if-no-files-found: ignore
